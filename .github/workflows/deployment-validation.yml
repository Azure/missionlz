---

name: deployment-validation

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      location:
        description: Approved AllInOne region
        type: choice
        options: [usgovarizona]
        default: usgovarizona
      environment_abbreviation:
        description: MLZ environment abbreviation
        type: choice
        options: [dev, test, prod]
        default: dev
      identifier:
        description: Optional identifier (1-5 lowercase letters or digits)
        type: string
      test_script_path:
        description: Optional test script from main (unconfigured means skipped)
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mlz-allinone-deployment-validation
  cancel-in-progress: false

jobs:
  allinone:
    name: Deploy, validate, and clean up AllInOne
    runs-on: ubuntu-latest
    environment: AllInOne
    defaults:
      run:
        shell: pwsh
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Authenticate to Azure Government with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          environment: AzureUSGovernment
          audience: api://AzureADTokenExchangeUSGov

      - name: Validate deployment and clean up
        id: validation
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          MLZ_LOCATION: ${{ inputs.location || 'usgovarizona' }}
          MLZ_ENVIRONMENT_ABBREVIATION: >-
            ${{ inputs.environment_abbreviation || 'dev' }}
          MLZ_IDENTIFIER: ${{ inputs.identifier }}
          MLZ_TEST_SCRIPT_PATH: ${{ inputs.test_script_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve the checked-out source revision.'
          }
          "Source revision: $revision" |
              Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append
          $reportPath = Join-Path $env:RUNNER_TEMP 'validation-report.json'
          $parameters = @{
              SubscriptionId = $env:AZURE_SUBSCRIPTION_ID
              CloudEnvironment = 'AzureUSGovernment'
              Location = $env:MLZ_LOCATION
              EnvironmentAbbreviation = $env:MLZ_ENVIRONMENT_ABBREVIATION
              ReportOutputPath = $reportPath
          }
          if ($env:MLZ_IDENTIFIER) {
              $parameters.Identifier = $env:MLZ_IDENTIFIER
          }
          if ($env:MLZ_TEST_SCRIPT_PATH) {
              $parameters.TestScriptPath = $env:MLZ_TEST_SCRIPT_PATH
          }
          & ./tests/deployment/Invoke-DeploymentValidation.ps1 @parameters

      - name: Publish sanitized validation report
        if: always()
        # v4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: allinone-validation-report
          path: ${{ runner.temp }}/validation-report.json
          if-no-files-found: error
