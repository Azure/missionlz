#
# NOTE (non-bypassable gate, FR-009 / SC-005): for the ratchet to actually block
# merges, a repository admin MUST add the `pester-coverage` job as a required
# status check in branch protection for `main`. This is a one-time repo-settings
# action documented in docs/testing.md (US4). Without it the job still runs and
# reports, but a failing gate would not block merge.
---

name: pester-coverage
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pester-coverage:
    name: pester-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gallery search can report no match for Pester 6.0.0 even when that package exists.
      # Register the default repository, retry Install-Module, then install the package directly.
      - name: Install Pester (pinned for local/CI parity)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '6.0.0'
          try {
              if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  Register-PSRepository -Default
              }
          }
          catch {
              Write-Warning "PSGallery registration failed: $($_.Exception.Message)"
          }

          $installed = $false
          foreach ($attempt in 1..3) {
              try {
                  Install-Module Pester -RequiredVersion $version -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck
                  $installed = $true
                  break
              }
              catch {
                  Write-Warning "Install-Module attempt ${attempt} failed: $($_.Exception.Message)"
                  if ($attempt -lt 3) {
                      Start-Sleep -Seconds (5 * $attempt)
                  }
              }
          }

          if (-not $installed) {
              $tempRoot = Join-Path ([IO.Path]::GetTempPath()) "pester-$version"
              $archive = Join-Path $tempRoot "Pester.$version.zip"
              $expanded = Join-Path $tempRoot 'expanded'
              New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null
              Invoke-WebRequest -Uri "https://www.powershellgallery.com/api/v2/package/Pester/$version" -OutFile $archive
              if (Test-Path $expanded) {
                  Remove-Item $expanded -Recurse -Force
              }
              Expand-Archive -Path $archive -DestinationPath $expanded
              foreach ($item in @('_rels', 'package', '[Content_Types].xml', 'Pester.nuspec')) {
                  $path = Join-Path $expanded $item
                  if (Test-Path -LiteralPath $path) {
                      Remove-Item -LiteralPath $path -Recurse -Force
                  }
              }
              $destination = Join-Path $HOME ".local/share/powershell/Modules/Pester/$version"
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              Copy-Item -Path (Join-Path $expanded '*') -Destination $destination -Recurse -Force
          }

          $module = Get-Module -ListAvailable -Name Pester |
              Where-Object { $_.Version -eq [version]$version } |
              Select-Object -First 1
          if (-not $module) {
              throw "Pester $version was not installed."
          }
          Write-Output "Using $($module.Name) $($module.Version)"

      - name: Run tests and measure coverage
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

      - name: Enforce no-regression coverage ratchet gate
        shell: pwsh
        run: ./tests/Compare-Coverage.ps1 -CoverageReport ./coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
